<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3f6158">
<title>All바른 학생앱 설치</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="All바른 English">
<link rel="stylesheet" href="student-install.css">
<script defer src="student-install.js"></script>
</head>
<body>
<main class="install-card">
<a href="./" class="brand"><img src="icons/icon-192.png" width="72" height="72" alt="All바른"></a>
<p class="eyebrow">All바른 학생앱</p>
<h1>다음부터는<br>홈 화면에서 바로.</h1>
<p class="intro">단어·듣기와 수업 준비를<br>학원 아이콘 하나로 확인하세요.</p>
<ol class="progress" aria-label="설치 순서"><li>QR 접속</li><li>홈 화면에 추가</li><li>아이콘으로 실행</li></ol>
<section aria-labelledby="step-title">
<h2 id="step-title">홈 화면에 추가하기</h2>
<p id="install-message" role="status" aria-live="polite">기기에 맞는 설치 방법을 준비하고 있어요.</p>
<button id="install-action" type="button">설치 방법 보기</button>
<ol id="install-steps" hidden></ol>
<div id="address-help" hidden><label for="install-address">브라우저에서 열 주소</label><input id="install-address" readonly><button id="copy-address" type="button">주소 복사</button></div>
</section>
<p class="finish-note">추가한 뒤 이 화면을 닫고, 홈 화면의 All바른 아이콘을 눌러 시작하세요.</p>
<a class="skip" href="./">설치 없이 학생웹앱 열기</a>
<noscript><p>아이폰: Safari의 공유 → 홈 화면에 추가. 안드로이드: Chrome 메뉴 → 홈 화면에 추가 또는 앱 설치를 선택하세요.</p></noscript>
</main>
</body></html>

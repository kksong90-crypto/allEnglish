name: Student published release smoke
on:
  push:
    branches: [main]
    paths: ['practice-experience.js', 'practice-experience.css', 'scripts/check-published-student.mjs', 'index.html', 'station-library.js', '.github/workflows/student-release-smoke.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-published-student.mjs

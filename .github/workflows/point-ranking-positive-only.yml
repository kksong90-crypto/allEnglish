# Read-only validation. This workflow does not deploy the student web or modify the Student API.
name: Student web positive-only point ranking validation

on:
  pull_request:
    branches:
      - agent/student-web-clean-history-20260809
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-web-point-ranking-positive-only-pr
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/student-web-point-ranking-positive-only
          fetch-depth: 0

      - name: Validate point ranking contract
        run: node tests/point_ranking_positive_only.js .

      - name: Verify source identity and API contract
        run: |
          git diff --check
          grep -F '6.6.1-POINT-RANK-POSITIVE-ONLY' index.html
          grep -F '6.5.1-VOCA-GATEWAY-RETEST-SAFETY' index.html
          test -z "$(git diff --name-only index.html)"

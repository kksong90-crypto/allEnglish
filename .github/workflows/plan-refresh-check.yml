name: Published plan refresh verification
on:
  pull_request:
    paths: ['index.html', 'tests/schedule-freshness.test.mjs', 'app-auto-update.js', 'tests/app-auto-update.test.mjs', '.github/workflows/plan-refresh-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 7d0ec1b20072af9625044e63a7a8ac94234ddb3d
          path: baseline
      - name: Same-day and mobile resume regression
        run: node --test tests/app-auto-update.test.mjs tests/schedule-freshness.test.mjs tests/schedule_duplicate_warning.mjs tests/assigned_exam_practice_contract.mjs tests/login-timeout.test.mjs tests/favorite-session-safety.test.mjs tests/readonly-flights.test.mjs
      - name: Korean timezone update regression
        run: TZ=Asia/Seoul node --test tests/app-auto-update.test.mjs
      - name: Compare full existing regression with pinned baseline
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          const files=['tests/schedule_duplicate_warning.mjs','tests/assigned_exam_practice_contract.mjs','tests/login-timeout.test.mjs','tests/vocab-read-load.test.mjs','tests/favorite-session-safety.test.mjs','tests/schedule-freshness.test.mjs','tests/admin_class_schedule.mjs','tests/staff_schedule_preview.mjs','tests/native-optin-browse.test.mjs','tests/recording-read-timing.test.mjs','tests/recording-date-identity.test.mjs','tests/recording-read-write-race.test.mjs','tests/recording-cache-ownership.test.mjs','tests/recording-incremental-save.test.mjs','tests/readonly-flights.test.mjs','test_recording_session_relogin.mjs','test_staff_runtime_stability.mjs','tests/recording-student-scope.test.mjs'];
          function run(cwd){const r=spawnSync(process.execPath,['--test',...files],{cwd,encoding:'utf8',maxBuffer:10000000});const text=r.stdout+'\n'+r.stderr;return {status:r.status,failures:[...text.matchAll(/^not ok \d+ - (.+)$/gm)].map(x=>x[1]).sort(),summary:text.split('\n').filter(x=>/^# (tests|pass|fail) /.test(x))};}
          const baseline=run('baseline'),candidate=run('.');
          console.log(JSON.stringify({baseline,candidate}));
          if(candidate.status!==0 && (!candidate.failures.length||JSON.stringify(candidate.failures)!==JSON.stringify(baseline.failures)))process.exitCode=1;
          NODE

name: Apply point start key hotfix

on:
  push:
    branches:
      - hotfix/student-point-start-key-20260827

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/student-point-start-key-20260827
          fetch-depth: 0

      - name: Apply exact minimal patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          source = path.read_text(encoding='utf-8')

          old_version = '<meta name="allbarun-student-version" content="6.3.0-FUTURE-PREPARATION-PRODUCTION" />'
          new_version = '<meta name="allbarun-student-version" content="6.3.1-POINT-START-KEY-HOTFIX" />'

          marker = "function pointDraftStorageKey() {\n"
          helper = (
              "function pointStartKeyStorageKey() {\n"
              "  const studentKey = String(currentUser?.id || currentUser?.studentId || \"guest\").trim() || \"guest\";\n"
              "  return `allbarun-point-start-key:${studentKey}`;\n"
              "}\n\n"
              "function getOrCreatePointStartKey() {\n"
              "  const storageKey = pointStartKeyStorageKey();\n"
              "  let value = \"\";\n"
              "  try { value = sessionStorage.getItem(storageKey) || \"\"; } catch (ignore) {}\n\n"
              "  if (!/^[A-Za-z0-9_-]{16,160}$/.test(value)) {\n"
              "    let randomPart = \"\";\n"
              "    try {\n"
              "      randomPart = globalThis.crypto?.randomUUID\n"
              "        ? globalThis.crypto.randomUUID().replaceAll(\"-\", \"\")\n"
              "        : \"\";\n"
              "    } catch (ignore) {}\n"
              "    if (!randomPart) {\n"
              "      randomPart = `${Date.now()}_${Math.random().toString(36).slice(2)}_${Math.random().toString(36).slice(2)}`;\n"
              "    }\n"
              "    value = `POINTSTART_${randomPart}`;\n"
              "    try { sessionStorage.setItem(storageKey, value); } catch (ignore) {}\n"
              "  }\n\n"
              "  return value;\n"
              "}\n\n"
              "function clearPointStartKey() {\n"
              "  try { sessionStorage.removeItem(pointStartKeyStorageKey()); } catch (ignore) {}\n"
              "}\n\n"
              "function pointDraftStorageKey() {\n"
          )

          old_start = 'const result = await apiPost({ action: "getPointTestInfo" });'
          new_start = 'const result = await apiPost({ action: "getPointTestInfo", startKey: getOrCreatePointStartKey() });'

          old_error = (
              "    if (!result.success) {\n"
              "      target.innerHTML = `<div class='card'>${escapeHtml(result.message || \"포인트 시험을 불러오지 못했습니다.\")}</div>`;\n"
              "      return;\n"
              "    }\n"
          )
          new_error = (
              "    if (!result.success) {\n"
              "      if (String(result.message || \"\").includes(\"시험시작요청키\")) clearPointStartKey();\n"
              "      target.innerHTML = `<div class='card'>${escapeHtml(result.message || \"포인트 시험을 불러오지 못했습니다.\")}</div>`;\n"
              "      return;\n"
              "    }\n"
          )

          old_complete = (
              "  } finally {\n"
              "    pointSubmitting = false;\n"
              "    if (completed) currentPointTest = null;\n"
              "    else if (currentPointTest && Number(currentPointTest.remainingSeconds || 0) > 0) startPointTimer(currentPointTest.remainingSeconds);\n"
              "  }\n"
          )
          new_complete = (
              "  } finally {\n"
              "    pointSubmitting = false;\n"
              "    if (completed) {\n"
              "      clearPointStartKey();\n"
              "      currentPointTest = null;\n"
              "    }\n"
              "    else if (currentPointTest && Number(currentPointTest.remainingSeconds || 0) > 0) startPointTimer(currentPointTest.remainingSeconds);\n"
              "  }\n"
          )

          replacements = [
              (old_version, new_version, 'student version marker'),
              (marker, helper, 'point start key helpers'),
              (old_start, new_start, 'startKey request parameter'),
              (old_error, new_error, 'rejected key regeneration guard'),
              (old_complete, new_complete, 'clear key after confirmed submission'),
          ]

          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Add focused contract test
        shell: bash
        run: |
          mkdir -p tests
          cat > tests/student_point_start_key_hotfix.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import vm from 'node:vm';

          const source = fs.readFileSync(new URL('../index.html', import.meta.url), 'utf8');
          assert.match(source, /6\.3\.1-POINT-START-KEY-HOTFIX/);
          assert.equal((source.match(/function pointStartKeyStorageKey\(/g) || []).length, 1);
          assert.equal((source.match(/function getOrCreatePointStartKey\(/g) || []).length, 1);
          assert.equal((source.match(/function clearPointStartKey\(/g) || []).length, 1);
          assert.match(source, /POINTSTART_/);
          assert.match(source, /getPointTestInfo", startKey: getOrCreatePointStartKey\(\)/);
          assert.match(source, /includes\("시험시작요청키"\)\) clearPointStartKey\(\)/);
          assert.match(source, /if \(completed\) \{\s*clearPointStartKey\(\);\s*currentPointTest = null;/);
          assert.doesNotMatch(source, /apiPost\(\{ action: "getPointTestInfo" \}\)/);

          const inlineScripts = [...source.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1])
            .filter(script => script.includes('async function startPointTest'));
          assert.equal(inlineScripts.length, 1, 'expected exactly one main inline application script');
          new vm.Script(inlineScripts[0], { filename: 'index-inline.js' });
          console.log('student point start key hotfix contract: PASS');
          EOF

      - name: Validate hotfix
        shell: bash
        run: |
          node tests/student_point_start_key_hotfix.mjs
          git diff --check

      - name: Commit validated hotfix and remove patcher workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-point-start-key-hotfix.yml
          git add index.html tests/student_point_start_key_hotfix.mjs
          git commit -m "fix: add idempotency key to student point test start"
          git push origin HEAD:hotfix/student-point-start-key-20260827

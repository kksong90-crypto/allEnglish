name: Web safety regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'practice-experience.js'
      - 'prepared-practice-cache.js'
      - 'practice-experience.css'
      - 'install.html'
      - 'student-install.js'
      - 'student-install.css'
      - 'student-shell.css'
      - 'app-auto-update.js'
      - 'manifest.json'
      - 'icons/**'
      - 'icon-*.png'
      - 'admin-class-schedule.js'
      - 'admin-school-scope-preview.*'
      - 'staff-*.js'
      - 'staff-*.mjs'
      - 'recording/**'
      - 'quick/**'
      - 'tests/**'
      - 'scripts/check-student-web.mjs'
      - 'scripts/check-published-student.mjs'
      - 'test_recording_session_relogin.mjs'
      - 'test_staff_runtime_stability.mjs'
      - '.github/workflows/web-safety.yml'
  workflow_dispatch:
# Cancel only outdated PR checks. Manual diagnostics remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and all portable synthetic regressions (no live API)
        run: node scripts/check-student-web.mjs
      - name: Published student smoke script syntax only (production GET is post-deploy)
        run: node --check scripts/check-published-student.mjs


name: Web safety regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'student-shell.css'
      - 'app-auto-update.js'
      - 'manifest.json'
      - 'icons/**'
      - 'icon-*.png'
      - 'admin-class-schedule.js'
      - 'admin-school-scope-preview.*'
      - 'staff-*.js'
      - 'staff-*.mjs'
      - 'recording/**'
      - 'quick/**'
      - 'tests/**'
      - 'scripts/check-student-web.mjs'
      - 'test_recording_session_relogin.mjs'
      - 'test_staff_runtime_stability.mjs'
      - '.github/workflows/web-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and all portable synthetic regressions (no live API)
        run: node scripts/check-student-web.mjs

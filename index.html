<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3f6158">
  <title>All바른 English</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f0f4f2;color:#24534a}
    .boot{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
    .boot-card{background:#fff;border:1px solid #dce9e5;border-radius:20px;padding:24px;box-shadow:0 10px 28px rgba(29,67,60,.10)}
    .boot-title{font-weight:900;font-size:1.15rem}.boot-sub{margin-top:8px;font-size:.9rem;color:#6d817b}
  </style>
</head>
<body>
  <div class="boot"><div class="boot-card"><div class="boot-title">All바른 English</div><div class="boot-sub">최신 학습 정보를 불러오는 중입니다...</div></div></div>
  <script>
    (async () => {
      try {
        const response = await fetch('./legacy.html?bootstrap=6.3.1', { cache: 'no-store' });
        if (!response.ok) throw new Error('앱 본문을 불러오지 못했습니다: ' + response.status);
        let html = await response.text();
        const syncTag = '<script src="./sync-layer.js?v=6.3.1"><\\/script>';
        if (/<\\/body>/i.test(html)) html = html.replace(/<\\/body>/i, syncTag + '\n</body>');
        else html += syncTag;
        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        document.body.innerHTML = '<div class="boot"><div class="boot-card"><div class="boot-title">앱을 불러오지 못했습니다.</div><div class="boot-sub">인터넷 연결을 확인한 뒤 다시 실행해 주세요.</div></div></div>';
        console.error(err);
      }
    })();
  </script>
</body>
</html>
